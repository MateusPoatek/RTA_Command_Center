<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #1a1a2e; }
    h1 { font-size: 13px; margin: 0 0 2px; }
    .sub { color: #666; font-size: 11px; margin-bottom: 10px; }
    .stat { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .count { font-size: 28px; font-weight: 700; color: #c0392b; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
    ul { list-style: none; margin: 10px 0 0; padding: 0; max-height: 220px; overflow: auto; }
    li { padding: 6px 8px; border-left: 3px solid #c0392b; background: #faf7f7; margin-bottom: 4px; border-radius: 3px; font-size: 11px; }
    li.medium { border-color: #e67e22; } li.low { border-color: #999; }
    .hint { color: #888; font-size: 10px; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>RTA Live Bridge</h1>
  <div class="sub">Verint → RTA Command Center</div>
  <div class="stat"><span class="count" id="count">0</span><span>adherence alerts captured</span></div>
  <button id="push">Push to Command Center</button>
  <div id="sync" style="color:#666;font-size:10px;margin-top:8px;"></div>
  <ul id="list"></ul>
  <div class="hint">Open the Verint calendar (apply your account filter) to capture, then open the Command Center at localhost:5173 to see the cards.</div>
  <script src="popup.js"></script>
</body>
</html>
